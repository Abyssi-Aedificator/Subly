<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#143d39"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><title>Subly · Subscription tracker</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script><script defer src="dropbox.js"></script></head>
<body><header><div class="bar"><a class="brand" href="./index.html"><i aria-hidden="true">≋</i> Subly <span class="version-badge" aria-label="Version 1.0.0">1.0.0</span></a><div class="header-actions"><a class="settings-link" href="#settings" id="settings-link">Settings</a></div></div></header>
<main id="overview"><div class="heading"><h1>Overview</h1><button class="primary" id="add">＋ Add subscription</button></div>
<div class="grid"><section class="summary"><div class="label">Monthly equivalent · CAD</div><strong id="monthly"></strong><div class="stats"><div><span>Yearly equivalent</span><b id="yearly"></b></div><div><span>Active services</span><b id="active"></b></div></div></section>
<section class="upcoming"><h2>Upcoming renewals</h2><div id="upcoming"></div></section></div>
<section class="library"><div class="controls"><h2>Subscriptions</h2><div class="filters"><input id="search" type="search" aria-label="Search subscriptions" placeholder="Search services"><select id="status" aria-label="Filter status"><option>All statuses</option><option>Active</option><option>Paused</option><option>Cancelled</option></select></div></div><div id="list"></div></section>
<p id="notice" role="status"></p></main>
<main id="settings" hidden><div class="heading"><h1>Settings</h1><a class="settings-link" href="#overview">Back to overview</a></div><section class="library"><h2>Appearance</h2><label for="theme-switch">Theme</label><select id="theme-switch" aria-label="Theme"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></section><section class="library"><h2>Dropbox backup</h2><p id="dropbox-status" class="dropbox-status" role="status"></p><form id="dropbox-connect"><label>Dropbox app key<input name="appKey" required autocomplete="off"></label><button type="submit">Connect Dropbox</button></form><div id="dropbox-actions" hidden><button id="dropbox-upload">Back up now</button> <button id="dropbox-download">Restore backup</button> <button id="dropbox-disconnect">Disconnect</button></div></section><section class="library"><h2>Release notes</h2><button id="open-changelog" type="button">View changelog</button></section></main><dialog id="changelog-dialog" aria-labelledby="changelog-title"><div class="controls"><h2 id="changelog-title">Changelog</h2><form method="dialog"><button>Close</button></form></div><div id="changelog-content" aria-live="polite"></div></dialog><dialog id="editor"><form id="form"><div class="controls"><h2 id="title">Add subscription</h2><button type="button" id="close" aria-label="Close">×</button></div><label>Service name<input name="service" required maxlength="80" placeholder="e.g. Spotify"></label><label>Price <span id="currency"></span><input name="price" type="number" min="0" max="999999999" step="0.01" required></label><label>Billing cycle<select name="cycle"><option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="weekly">Weekly</option></select></label><label>Renewal date<input name="date" type="date" min="1900-01-01" max="9999-12-31" required></label><label>Status<select name="state"><option>Active</option><option>Paused</option><option>Cancelled</option></select></label><div class="actions"><button type="button" id="remove">Delete</button><button class="primary" type="submit">Save subscription</button></div><p role="alert" id="error"></p></form></dialog></body></html>
